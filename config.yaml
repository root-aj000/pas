# config.yaml
#
# Every setting in this project, in one place. This file is not code.
# Read it through src/config/configuration.py, never directly from a component.
#
# Rule behind the file: if a value could plausibly change between experiments, it
# lives here. Changing a setting is a one-line committed edit, so the git history
# records which settings produced which result.

# --- Paths -------------------------------------------------------------------
data_path: "/kaggle/input/competitions/playground-series-s6e10/train.csv"
competition_test_path: "/kaggle/input/competitions/playground-series-s6e10/test.csv"
sample_submission_path: "/kaggle/input/competitions/playground-series-s6e10/sample_submission.csv"

artifacts_path: "artifacts"
models_path: "models"
report_path: "reports"
log_path: "logs"

# --- Reproducibility ---------------------------------------------------------
# One seed for the whole project. See docs/split_plan.md - the split, the model
# and every comparison all use this value.
random_seed: 42

# --- The target --------------------------------------------------------------
target_column: "satisfaction"

# Never used as features. `satisfaction` is the answer. `id` is a row number in
# the organisers' shuffled list, and every training id is lower than every test
# id, so a model that saw it would learn their 70/30 cut instead of air travel.
# src/components/data_cleaning_encoding.py asserts these stay out.
banned_features:
  - "id"
  - "satisfaction"

features:
  # The four categorical columns go in by their real names, not as indicators.
  # Measured 0.958868 validation ROC-AUC against 0.955924 one-hot, so this is
  # the largest single gain in the project. See research/ensemble_experiments.py.
  - "Gender"
  - "Customer Type"
  - "Type of Travel"
  - "Class"
  - "Online boarding"
  - "mean_service_rating"
  - "Inflight entertainment"
  - "Seat comfort"
  - "On-board service"
  - "Cleanliness"
  - "Leg room service"
  - "Flight Distance"
  - "Inflight wifi service"
  - "Age"
  # Added back after an ablation, because each of these measured as a small but
  # real gain. Their individual effect sizes are negligible (Cliff's delta below
  # 0.06) but they are worth 0.0055 ROC-AUC together. See the note below and
  # docs/experiment_log.md run 6.
  - "Departure/Arrival time convenient"
  - "Gate location"
  - "Baggage handling"
  - "Ease of Online booking"
  - "Checkin service"
  - "Food and drink"
  - "worst_service_rating"
  - "count_of_ratings_at_or_below_2"


  # DISABLED 2026-10-05. Measured -0.0025 validation / -0.0028 test against
  # the 22-feature model_6. Thirteen near-duplicates of existing signal dilute
  # splits across redundant columns. They helped the reference notebook (+0.00013)
  # whose carriers were neural nets, not trees. See docs/experiment_log.md run 21.
  # - "expected_Inflight wifi service"
  # - "expected_Departure/Arrival time convenient"
  # - "expected_Ease of Online booking"
  # - "expected_Gate location"
  # - "expected_Food and drink"
  # - "expected_Online boarding"
  # - "expected_Seat comfort"
  # - "expected_Inflight entertainment"
  # - "expected_On-board service"
  # - "expected_Leg room service"
  # - "expected_Baggage handling"
  # - "expected_Checkin service"
  # - "expected_Cleanliness"


  # DISABLED 2026-10-05. Measured -0.0004 validation / -0.00035 test against
  # the 22-feature model_4. They helped the reference notebook (+0.0016) whose
  # base was raw columns; our base already has native categoricals and derived
  # features, so the marginal value is zero or negative. Kept so nobody re-adds
  # them blindly. See docs/experiment_log.md run 20.
  # Route-ID features. Generated by stage 2 from the train-built route table.
  # See the route_features section above. All 18 go in; trees ignore the useless ones cheaply.
  # - "route_size"
  # - "route_target_encoded"
  # - "route_mean_Inflight wifi service"
  # - "route_mean_Departure/Arrival time convenient"
  # - "route_mean_Ease of Online booking"
  # - "route_mean_Gate location"
  # - "route_mean_Food and drink"
  # - "route_mean_Online boarding"
  # - "route_mean_Seat comfort"
  # - "route_mean_Inflight entertainment"
  # - "route_mean_On-board service"
  # - "route_mean_Leg room service"
  # - "route_mean_Baggage handling"
  # - "route_mean_Checkin service"
  # - "route_mean_Cleanliness"
  # - "route_mean_Age"
