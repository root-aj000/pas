  # - "route_mean_Arrival Delay in Minutes"

# --- The split ---------------------------------------------------------------
# Frozen. See docs/split_plan.md for why a random stratified split is correct
# here: the dataset has no date column and no passenger identifier, so there is
# no time axis and no entity to hold out.
test_size: 0.15
validation_size: 0.15

# Kept as inputs because they may become features once open question 3 is
# answered. They are computed and logged every run, but not used for fitting.
candidate_features_pending_question:
  - "Arrival Delay in Minutes"
  - "Departure Delay in Minutes"

# Measured to carry no usable signal, and removed for that reason.
#
# Effect size on the marginal distribution predicted these three would be
# worthless. The ablation in docs/experiment_log.md run 6 measured what they are
# actually worth to the model, which is the number that matters:
#
#   Gender (both dummies)              +0.000000  exactly nothing
#   Departure + Arrival Delay          -0.000048  nothing, marginally negative
#
# Both are genuinely dead. The other six "negligible" ratings were measured at
# between +0.0003 and +0.0024 each and are kept.
#
# The lesson worth keeping: Departure/Arrival time convenient has the WORST
# individual effect size of the thirteen ratings, Cliff's delta -0.0525, and is
# the single biggest contributor to ROC-AUC. Marginal effect size did not predict
# value to the model at all. Never drop a column on its univariate statistic
# alone.
dropped_features:
  Gender: "Cramer's V 0.0080; worth +0.000000 AUC in ablation"
  Departure_Delay_in_Minutes: "Cliff's delta -0.0178; worth -0.000048 AUC in ablation"
  Arrival_Delay_in_Minutes: "Cliff's delta -0.0322; pending open question 3"
  arrival_delay_status: "computed and logged every run, but not a feature. Its own groups are already inside Class and Type of Travel."

# --- Categorical encoding ----------------------------------------------------
# Two options, and the difference is measured, not assumed.
#
#   native   - the four categorical columns are kept as pandas `category` dtype and
#              XGBoost partitions them itself. 0.958868 validation ROC-AUC.
#   one_hot  - replaced by indicator columns. 0.955924 validation ROC-AUC, and the
#              only option every estimator can read.
#
# native wins by +0.0029, more than all hyperparameter tuning combined (+0.0003).
# It is also an XGBoost feature: scikit-learn estimators cannot read `category`
# dtype. Choose one_hot if you switch to logistic regression or a random forest.
#
# The `features` list below is written for categorical_encoding: native. If you
# switch to one_hot, replace the four category columns with their indicators:
#   Class_Business, Class_Eco, Class_Eco Plus,
#   Type of Travel_Business travel, Type of Travel_Personal Travel,
#   Customer Type_Loyal Customer, Customer Type_disloyal Customer
# and drop Gender entirely (it was measured at exactly +0.000000).
categorical_encoding: native

# --- The feature list --------------------------------------------------------
# The shortlist from docs/eda_findings.md section 10, as corrected by the ablation
# in docs/experiment_log.md run 6. Every feature here earned its place by
# measurement. The columns that did not are listed under dropped_features below, so
# the decision stays visible rather than silent.

# --- Route-ID features -------------------------------------------------------
# Treat Flight Distance as a route identifier, not just a number. Per-route
# statistics tell the model WHICH route a row belongs to, which a raw number
# cannot. Measured +0.0016 by [s6e10 route-ID work] - the largest single gain
# after native categorical encoding.
#
# Three blocks, all computed from TRAIN ONLY and applied everywhere:
#   route_size            - how many rows share this Flight Distance. No label.
#   route_mean_<column>   - per-route mean of each numeric column. No label.
#   route_target_encoded  - smoothed satisfaction rate of the route. Uses the
#                           label, so it is out-of-fold for train rows (no row
#                           ever sees its own label) and full-train mapping
#                           everywhere else. Unseen routes get the global mean.
route_features:
  enabled: false
  # Blend weight toward the global mean. A route with fewer than this many rows
  # is pulled most of the way to the overall rate, so a tiny route cannot define
  # its own target value.
  smoothing: 20.0

# --- Auxiliary-task features -------------------------------------------------
# Predict each of the 13 ratings from the other columns. +0.00013. Out-of-fold
# for train rows, full-train models everywhere else. No label is used as an
# input - each rating is predicted from the other 20 columns only.
auxiliary_features:
  enabled: false

# --- Derived features --------------------------------------------------------
# Built by src/components/data_cleaning_encoding.py, not read from a column.
# mean_service_rating has the second-strongest effect size in the whole dataset
# (Cliff's delta 0.6029) and is the best derived column.
derived_features:
  - name: "mean_service_rating"
    description: "Mean of the 13 service ratings, 0-5. How good the flight was overall."
  - name: "worst_service_rating"
    description: "Lowest of the 13 service ratings. Kept because the EDA tested it and it lost to the mean."
  - name: "count_of_ratings_at_or_below_2"
    description: "How many of the 13 services were rated 2 or worse. A count of complaints."

# --- Outliers ----------------------------------------------------------------
# Measured and deliberately left alone. See docs/outlier_findings.md.
# Clipping changes validation ROC-AUC by +0.000076, which is noise, and clipping
# would invent a ceiling the world does not have. Set to true only to re-run the
# experiment that proved it unnecessary.
clip_outliers: false
clip_lower_percentile: 0.1
clip_upper_percentile: 99.9

# --- Missing values ----------------------------------------------------------
# 204 rows in the train split have no recorded arrival delay. We do not know what
# a blank means - on-time flight, unrecorded value, or cancellation
# (docs/column_dictionary.md Note 1, open question 3). They are kept as their own
# `arrival_delay_status: unknown` group rather than filled in, because calling a
# blank flight "on time" would be a decision presented as a fact.
arrival_delay_median_for_model: 0.0

# --- Model -------------------------------------------------------------------
# The name maps to a class in MODEL_REGISTRY, in
# src/components/model_training.py. Change this one line to try another method.
#
# Gradient boosting, chosen per .lead/02-C Step 1 and .lead/02-D section 1:
# gradient boosting first on tabular data.
#
# XGBoost over HistGradientBoosting by 0.0010 ROC-AUC in
# research/compare_models.py, and by a further 0.0010 with the settings below.
# It also has device="cuda", so this is the model that can use the Kaggle GPU.
# The cost is one more dependency. See docs/experiment_log.md runs 6 to 10.
#
# Measured validation ROC-AUC: 0.955511. HistGradientBoosting at its best
# settings reached 0.955013, so the gap is real but small.
model_name: "xgboost"

# Hyperparameters for the chosen method. Measured, not guessed - see
# research/auc_experiments.py and research/auc_experiments_round2.py.
# Never edited inside the training script.
#
# These were set by hand to size the prize before installing Optuna. They are the
# best of 11 settings tried, and pushing further stopped paying: depth 10 with
# 1500 trees scored 0.955247, worse than depth 8 with 1000. Optuna should replace
# them.
model_params:
  max_depth: 8
  n_estimators: 1400
  learning_rate: 0.10
  # colsample 0.6 and max_bin 1024 are the two things the random search found that
  # the earlier hand-picked grid never tried. Two independent configurations in
  # this direction both beat the previous settings, so it is a pattern rather than
  # one lucky point. See research/xgb_search.py.
  subsample: 1.0
  colsample_bytree: 0.6
  reg_alpha: 0.01
  reg_lambda: 2.0
  gamma: 0.1
  max_bin: 1024
  tree_method: "hist"
  device: "gpu"

# --- Metric ------------------------------------------------------------------
# Open question 6 is not settled: it is unknown whether the competition scores
# ROC-AUC or accuracy. Both are computed and reported every run, so the answer is
# already there whichever it turns out to be. The two agree on the ranking.
metrics:
  - "roc_auc"
  - "accuracy"
  - "f1"
  - "precision"
  - "recall"

# Used only for the confusion matrix and the hard-label report. Not used for
# ranking, because a threshold agreed by nobody is meaningless - see
# .lead/04-EVALUATION-AND-GO-NO-GO.md Step 4.4.
decision_threshold: 0.5

# --- Training budget ---------------------------------------------------------
# .lead/03 Step 3.4: set the limit before you start and honour it. A search that
# keeps finding 0.1% gains for six hours is not useful.
max_training_seconds: 3600

# --- GPU ---------------------------------------------------------------------
# There is no use_gpu switch, deliberately. XGBoost takes its device from
# model_params above - set device: "cuda" there and it trains on the Kaggle GPU.
# A second switch that also controlled the device would be two places to forget.
#
# NOTE BEFORE YOUR FIRST GPU RUN: check it against 0.954479 test ROC-AUC, the
# number the CPU produced. A silent GPU/CPU divergence is the kind of thing nobody
# notices for a week.