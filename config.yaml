# config.yaml
#
# Every setting in this project, in one place. This file is not code.
# Read it through src/config/configuration.py, never directly from a component.
#
# Rule behind the file: if a value could plausibly change between experiments, it
# lives here. Changing a setting is a one-line committed edit, so the git history
# records which settings produced which result.

# --- Paths -------------------------------------------------------------------
# Relative paths. Resolved against the project root on any machine, so this file
# is never edited per machine. On Kaggle, where data/ does not exist, the reader
# scans /kaggle/input/ for the same filenames automatically - see
# docs/kaggle_gpu_runbook.md. Do NOT put absolute Kaggle paths here; an absolute
# path is honoured untouched and breaks every other machine.
data_path: "data/train.csv"
competition_test_path: "data/test.csv"
sample_submission_path: "data/sample_submission.csv"

# On Kaggle, /kaggle/input holds several mounts and more than one of them can
# contain a train.csv. Naming the dataset we mean removes the guess: the reader
# prefers this directory, and only falls back to scanning when it is absent.
# Set this per-machine on Kaggle. Leave empty to auto-scan /kaggle/input/.
kaggle_dataset_path: null

artifacts_path: "artifacts"
models_path: "models"
report_path: "reports"
log_path: "logs"

# --- Reproducibility ---------------------------------------------------------
# One seed for the whole project. See docs/split_plan.md - the split, the model
# and every comparison all use this value.
random_seed: 42

# --- Device ------------------------------------------------------------------
# The single device setting for the whole project: exactly "cuda" or "cpu".
# Nothing in src/ hardcodes a device and nothing guesses one. model_params.device
# and ensemble.device below are YAML references to this value, so changing it here
# moves the single-model path and every ensemble member together, and it is
# impossible for them to disagree.
device: &device cuda

# --- The target --------------------------------------------------------------
target_column: "satisfaction"

# Never used as features. `satisfaction` is the answer. `id` is a row number in
# the organisers' shuffled list, and every training id is lower than every test
# id, so a model that saw it would learn their 70/30 cut instead of air travel.
# src/components/data_cleaning_encoding.py asserts these stay out.
banned_features:
  - "id"
  - "satisfaction"

