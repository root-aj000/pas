# --- The split ---------------------------------------------------------------
# Frozen. See docs/split_plan.md for why a random stratified split is correct
# here: the dataset has no date column and no passenger identifier, so there is
# no time axis and no entity to hold out.
test_size: 0.15
validation_size: 0.15


# Kept as inputs because they may become features once open question 3 is
# answered. They are computed and logged every run, but not used for fitting.
candidate_features_pending_question:
  - "Arrival Delay in Minutes"
  - "Departure Delay in Minutes"

# Measured to carry no usable signal, and removed for that reason.
#
# Effect size on the marginal distribution predicted these three would be
# worthless. The ablation in docs/experiment_log.md run 6 measured what they are
# actually worth to the model, which is the number that matters:
#
#   Gender (both dummies)              +0.000000  exactly nothing
#   Departure + Arrival Delay          -0.000048  nothing, marginally negative
#
# Both are genuinely dead. The other six "negligible" ratings were measured at
# between +0.0003 and +0.0024 each and are kept.
#
# The lesson worth keeping: Departure/Arrival time convenient has the WORST
# individual effect size of the thirteen ratings, Cliff's delta -0.0525, and is
# the single biggest contributor to ROC-AUC. Marginal effect size did not predict
# value to the model at all. Never drop a column on its univariate statistic
# alone.
dropped_features:
  Gender: "Cramer's V 0.0080; worth +0.000000 AUC in ablation"
  Departure Delay in Minutes: "Cliff's delta -0.0178; worth -0.000048 AUC in ablation"
  Arrival Delay in Minutes: "Cliff's delta -0.0322; pending open question 3"
  arrival_delay_status: "computed and logged every run, but not a feature. Its own groups are already inside Class and Type of Travel."

# --- Categorical encoding ----------------------------------------------------
# Two options, and the difference is measured, not assumed.
#
#   native   - the four categorical columns are kept as pandas `category` dtype and
#              XGBoost partitions them itself. 0.958868 validation ROC-AUC.
#   one_hot  - replaced by indicator columns. 0.955924 validation ROC-AUC, and the
#              only option every estimator can read.
#
# native wins by +0.0029, more than all hyperparameter tuning combined (+0.0003).
# It is also an XGBoost feature: scikit-learn estimators cannot read `category`
# dtype. Choose one_hot if you switch to logistic regression or a random forest.
#
# The `features` list below is written for categorical_encoding: native. If you
# switch to one_hot, replace the four category columns with their indicators:
#   Class_Business, Class_Eco, Class_Eco Plus,
#   Type of Travel_Business travel, Type of Travel_Personal Travel,
#   Customer Type_Loyal Customer, Customer Type_disloyal Customer
# and drop Gender entirely (it was measured at exactly +0.000000).
categorical_encoding: native

# --- The feature list --------------------------------------------------------
# The shortlist from docs/eda_findings.md section 10, as corrected by the ablation
# in docs/experiment_log.md run 6. Every feature here earned its place by
# measurement. The columns that did not are listed under dropped_features below, so
# the decision stays visible rather than silent.

# --- Route-ID features -------------------------------------------------------
# Treat Flight Distance as a route identifier, not just a number. Per-route
# statistics tell the model WHICH route a row belongs to, which a raw number
# cannot. Measured +0.0016 by [s6e10 route-ID work] - the largest single gain
# after native categorical encoding.
#
# Three blocks, all computed from TRAIN ONLY and applied everywhere:
#   route_size            - how many rows share this Flight Distance. No label.
#   route_mean_<column>   - per-route mean of each numeric column. No label.
#   route_target_encoded  - smoothed satisfaction rate of the route. Uses the
#                           label, so it is out-of-fold for train rows (no row
#                           ever sees its own label) and full-train mapping
#                           everywhere else. Unseen routes get the global mean.
route_features:
  enabled: true
  # Blend weight toward the global mean. A route with fewer than this many rows
  # is pulled most of the way to the overall rate, so a tiny route cannot define
  # its own target value.
  smoothing: 20.0

# --- Auxiliary-task features -------------------------------------------------
# Predict each of the 13 ratings from the other columns. +0.00013. Out-of-fold
# for train rows, full-train models everywhere else. No label is used as an
# input - each rating is predicted from the other 20 columns only.
auxiliary_features:
  enabled: false

# --- Categorical twins (v4 inputs) ---------------------------------------------
# Every numeric column gets a categorical twin: the value as an integer, then as
# a string, as a category. The net learns an embedding per distinct value.
# Measured +0.00046 by [reference] as "v4 inputs". Deterministic, no labels, no
# leakage possible. RealMLP-only: trees would see 18 sparse high-cardinality
# columns (Flight Distance alone has 3,474 distinct values) and choke on them.
categorical_twins:
  enabled: true

# --- Derived features --------------------------------------------------------
# Built by src/components/data_cleaning_encoding.py, not read from a column.
# mean_service_rating has the second-strongest effect size in the whole dataset
# (Cliff's delta 0.6029) and is the best derived column.
derived_features:
  - name: "mean_service_rating"
    description: "Mean of the 13 service ratings, 0-5. How good the flight was overall."
  - name: "worst_service_rating"
    description: "Lowest of the 13 service ratings. Kept because the EDA tested it and it lost to the mean."
  - name: "count_of_ratings_at_or_below_2"
    description: "How many of the 13 services were rated 2 or worse. A count of complaints."
  - name: "count_of_5s"
    description: "How many of the 13 services were rated 5. Count of perfect scores."
  - name: "count_of_1s"
    description: "How many of the 13 services were rated 1. Count of worst scores."
  - name: "rating_std"
    description: "Standard deviation of the 13 service ratings. Captures rating spread."
  - name: "online_boarding_x_class"
    description: "Integer-coded interaction: Online boarding x Class."
  - name: "online_boarding_x_travel_type"
    description: "Integer-coded interaction: Online boarding x Type of Travel."
  - name: "class_x_customer_type"
    description: "Integer-coded interaction: Class x Customer Type."
  - name: "age_bin"
    description: "Age bin index, 7 ordered groups. Integer, not a label."
  - name: "distance_bin"
    description: "Flight Distance bin index, 6 ordered groups. Integer, not a label."
  - name: "any_delay"
    description: "Binary: 1 if departure or arrival delay > 0."
  - name: "dep_delayed"
    description: "Binary: 1 if departure delay > 0."
  - name: "arr_delayed"
    description: "Binary: 1 if arrival delay > 0."
  - name: "delay_over_15min"
    description: "Binary: 1 if departure or arrival delay > 15 minutes."
  - name: "age_squared"
    description: "Age squared. Captures non-linear age effect."
  - name: "distance_squared"
    description: "Flight Distance squared. Captures non-linear distance effect."
  - name: "age_over_distance"
    description: "Age / (Flight Distance + 1). Ratio feature."
  - name: "delay_over_distance"
    description: "Total delay / (Flight Distance + 1). Delay per mile."

# --- Outliers ----------------------------------------------------------------
# Measured and deliberately left alone. See docs/outlier_findings.md.
# Clipping changes validation ROC-AUC by +0.000076, which is noise, and clipping
# would invent a ceiling the world does not have. Set to true only to re-run the
# experiment that proved it unnecessary.
clip_outliers: false
clip_lower_percentile: 0.1
clip_upper_percentile: 99.9

# --- Missing values ----------------------------------------------------------
# 204 rows in the train split have no recorded arrival delay. We do not know what
# a blank means - on-time flight, unrecorded value, or cancellation
# (docs/column_dictionary.md Note 1, open question 3). They are kept as their own
# `arrival_delay_status: unknown` group rather than filled in, because calling a
# blank flight "on time" would be a decision presented as a fact.
arrival_delay_median_for_model: 0.0

# --- Model -------------------------------------------------------------------
# The name maps to a class in MODEL_REGISTRY, in
# src/components/model_training.py. Change this one line to try another method.
#
# RealMLP, a tabular-specific neural network. Measured 0.959051 on our 22
# features against 0.958868 for XGBoost native - same split, same seed, same
# metric. The gap is small (+0.0002) but real, and this is the architecture with
# headroom left: XGBoost is tuned to its plateau and RealMLP is not.
# See docs/experiment_log.md runs 23+.
#
# Previous XGBoost settings (model_4, test 0.957894) are in git history and
# docs/experiment_log.md runs 13-16. To switch back: model_name "xgboost".
model_name: "realmlp"

# Hyperparameters: the published RealMLP recipe, flat_anneal schedule variant.
# Never edited inside the training script.
model_params:
  # The tuned RealMLP recipe, verbatim from the reference notebook's REALMLP
  # dict. This matters more than anything else in the file: pytabkit's own
  # RealMLP_TD_CLASS defaults differ in 23 of these 26 values, and the defaults
  # are a generic guess rather than this dataset's tuning. The two that cost us
  # most were plr_sigma (0.1 vs 2.33, which effectively disables the PLR
  # numerical embeddings that are the whole point of RealMLP) and ls_eps
  # (0.1 vs 0.01, ten times the label smoothing).
  #
  # lr_sched is flat_anneal rather than the recipe's lin_cos_log_15: the
  # reference measured flat_anneal at +0.00026 on raw inputs and equal on
  # engineered inputs, at half the training time.
  n_ens: 12
  n_epochs: 6
  batch_size: 256
  use_early_stopping: false
  lr: 0.053
  wd: 0.0236
  sq_mom: 0.988
  lr_sched: "flat_anneal"
  wd_sched: "cos_log_15"
  first_layer_lr_factor: 0.25
  embedding_size: 5
  max_one_hot_cat_size: 18
  hidden_sizes: [512, 256, 128]
  act: "silu"
  p_drop: 0.05
  p_drop_sched: "expm4t"
  plr_hidden_1: 16
  plr_hidden_2: 8
  plr_act_name: "gelu"
  plr_lr_factor: 0.1151
  plr_sigma: 2.33
  ls_eps: 0.01
  ls_eps_sched: "sqrt_cos"
  add_front_scale: false
  bias_init_mode: "neg-uniform-dynamic-2"
  tfms: ["one_hot", "median_center", "robust_scale", "smooth_clip", "embedding", "l2_normalize"]
  # wd_sched, p_drop_sched and ls_eps_sched resolve to lambdas, so the fitted
  # model is written with cloudpickle, not joblib.
  device: *device
metrics:
  - "roc_auc"
  - "accuracy"
  - "f1"
  - "precision"
  - "recall"

# Used only for the confusion matrix and the hard-label report. Not used for
# ranking, because a threshold agreed by nobody is meaningless - see
# .lead/04-EVALUATION-AND-GO-NO-GO.md Step 4.4.
decision_threshold: 0.5

# --- Training budget ---------------------------------------------------------
# .lead/03 Step 3.4: set the limit before you start and honour it. A search that
# keeps finding 0.1% gains for six hours is not useful.
max_training_seconds: 3600

# --- GPU ---------------------------------------------------------------------
# There is no use_gpu switch, deliberately. XGBoost takes its device from
# model_params above - set device: "cuda" there and it trains on the Kaggle GPU.
# A second switch that also controlled the device would be two places to forget.
#
# NOTE BEFORE YOUR FIRST GPU RUN: check it against 0.954479 test ROC-AUC, the
# number the CPU produced. A silent GPU/CPU divergence is the kind of thing nobody
# notices for a week.

# --- The ensemble ------------------------------------------------------------
# Stage 5 trains every member with the same folds and stacks their logits with a
# logistic regression. Enabling this skips stages 3 and 4, so a run produces one
# submission instead of two.
ensemble:
  enabled: true
  folds: 10
  seed: 42
  # auto -> cuda when a GPU is visible, cpu otherwise. One committed value has
  # to be right on a laptop and on a 2x T4 Kaggle session; a fixed "cpu"
  # silently trains everything on the processor and a fixed "cuda" crashes
  # locally. With more than one GPU, members are dealt round-robin across
  # them, one worker process per device.
  device: *device
  stack_C: 0.5
  pseudo_label_enabled: true
  pseudo_label_high: 0.95
  pseudo_label_low: 0.05
  feature_selection: true
  feature_selection_threshold: 0.90
  nonlinear_combiner: true
  probability_calibration: true
  members:
  - name: lightgbm
    kind: lightgbm
    params:
      n_estimators: 1500
      learning_rate: 0.03
      num_leaves: 127
      max_bin: 255
      subsample: 0.7
      colsample_bytree: 0.7
      reg_lambda: 1.0
      n_jobs: 8
  - name: realmlp_tuned
    kind: realmlp
    # No in-fold encodings: these members see every column at once, and
    # 31 extra encodings of columns still sitting beside them is more
    # of the same signal than a network can use. See MemberSpec.
    target_encodings: false
    params:
      n_ens: 16
      n_epochs: 6
      batch_size: 256
      use_early_stopping: false
      lr: 0.053
      wd: 0.0236
      sq_mom: 0.988
      lr_sched: flat_anneal
      wd_sched: cos_log_15
      first_layer_lr_factor: 0.25
      embedding_size: 5
      max_one_hot_cat_size: 18
      hidden_sizes: &id001
      - 512
      - 256
      - 128
      act: silu
      p_drop: 0.05
      p_drop_sched: expm4t
      plr_hidden_1: 16
      plr_hidden_2: 8
      plr_act_name: gelu
      plr_lr_factor: 0.1151
      plr_sigma: 2.33
      ls_eps: 0.01
      ls_eps_sched: sqrt_cos
      add_front_scale: false
      bias_init_mode: neg-uniform-dynamic-2
      tfms: &id002
      - one_hot
      - median_center
      - robust_scale
      - smooth_clip
      - embedding
      - l2_normalize
      n_refit: 1
      val_fraction: 0.2
  - name: realmlp_lowbudget
    kind: realmlp
    # No in-fold encodings: these members see every column at once, and
    # 31 extra encodings of columns still sitting beside them is more
    # of the same signal than a network can use. See MemberSpec.
    target_encodings: false
    params:
      batch_size: 256
      use_early_stopping: false
      lr: 0.053
      wd: 0.0236
      sq_mom: 0.988
      lr_sched: flat_anneal
      wd_sched: cos_log_15
      first_layer_lr_factor: 0.25
      embedding_size: 5
      max_one_hot_cat_size: 18
      hidden_sizes: *id001
      act: silu
      p_drop: 0.05
      p_drop_sched: expm4t
      plr_hidden_1: 16
      plr_hidden_2: 8
      plr_act_name: gelu
      plr_lr_factor: 0.1151
      plr_sigma: 2.33
      ls_eps: 0.01
      ls_eps_sched: sqrt_cos
      add_front_scale: false
      bias_init_mode: neg-uniform-dynamic-2
      tfms: *id002
      n_ens: 3
      n_epochs: 4
      n_refit: 1
      val_fraction: 0.2
  - name: xgboost
    kind: xgboost
    params:
      n_estimators: 1500
      learning_rate: 0.03
      max_depth: 8
      min_child_weight: 1.0
      reg_lambda: 1.0
      max_bin: 4096
      subsample: 0.7
      colsample_bytree: 0.8
      colsample_bylevel: 0.9
      tree_method: hist
      n_jobs: 8
  - name: tabnet
    kind: tabnet
    # No in-fold encodings: these members see every column at once, and
    # 31 extra encodings of columns still sitting beside them is more
    # of the same signal than a network can use. See MemberSpec.
    target_encodings: false
    params:
      n_d: 64
      n_a: 64
      n_steps: 5
      gamma: 1.5
      lambda_sparse: 0.001
      momentum: 0.02
      n_independent: 2
      n_shared: 2
      device: *device
  - name: xgb_d10
    kind: xgboost
    params:
      n_estimators: 1500
      learning_rate: 0.02
      max_depth: 10
      colsample_bytree: 0.55
      min_child_weight: 20
      tree_method: hist
      n_jobs: 8
  - name: xgb_d9
    kind: xgboost
    params:
      n_estimators: 1500
      learning_rate: 0.02
      max_depth: 9
      colsample_bytree: 0.8
      colsample_bynode: 0.5
      min_child_weight: 55
      tree_method: hist
      n_jobs: 8
  - name: lgb_deep
    kind: lightgbm
    params:
      n_estimators: 1500
      learning_rate: 0.02
      num_leaves: 255
      max_depth: 10
      min_child_samples: 80
      colsample_bytree: 0.5
      n_jobs: 8
  - name: cat_obl
    kind: catboost
    params:
      iterations: 1500
      learning_rate: 0.02
      depth: 7
      border_count: 254
      l2_leaf_reg: 4.0
  # Target encodings are fitted inside each training fold and applied to the
  # held-out part, so no row ever sees its own label. See src/components/ensemble.py.
  te_columns:
  - Inflight wifi service
